<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2b2118" flood-opacity="0.2"/></filter>
    <style>.h{font-family:'Bradley Hand','Segoe Print','Comic Sans MS',cursive}</style>
  </defs>
  <rect width="800" height="560" fill="#e9e5df"/>
  <!-- gym floor mat -->
  <rect y="420" width="800" height="140" fill="#3a3f45"/>
  <g stroke="#4a5057" stroke-width="2"><line x1="0" y1="470" x2="800" y2="470"/><line x1="0" y1="520" x2="800" y2="520"/></g>

  <!-- notebook -->
  <g transform="rotate(-4 300 270)" filter="url(#sh)">
    <rect x="70" y="50" width="440" height="420" rx="6" fill="#fffef8"/>
    <g stroke="#c9dcf0" stroke-width="1.5">
      <line x1="70" y1="120" x2="510" y2="120"/><line x1="70" y1="160" x2="510" y2="160"/><line x1="70" y1="200" x2="510" y2="200"/>
      <line x1="70" y1="240" x2="510" y2="240"/><line x1="70" y1="280" x2="510" y2="280"/><line x1="70" y1="320" x2="510" y2="320"/>
      <line x1="70" y1="360" x2="510" y2="360"/><line x1="70" y1="400" x2="510" y2="400"/><line x1="70" y1="440" x2="510" y2="440"/>
    </g>
    <line x1="120" y1="50" x2="120" y2="470" stroke="#f3b3b3" stroke-width="1.5"/>
    <g fill="#8d96a0"><circle cx="90" cy="80" r="6"/><circle cx="90" cy="180" r="6"/><circle cx="90" cy="280" r="6"/><circle cx="90" cy="380" r="6"/></g>

    <g class="h" fill="#2f3b4a">
      <text x="132" y="112" font-size="24">Push – Mon (or Tue?)</text>
      <text x="132" y="152" font-size="21">bench 135 × 8 … or 145?</text>
      <text x="132" y="192" font-size="21">incline DB 50s</text>
      <text x="300" y="192" font-size="21">45s?</text>
      <text x="132" y="232" font-size="21">OHP – same as last wk??</text>
      <text x="132" y="272" font-size="21">dips 3 × ?</text>
      <text x="132" y="312" font-size="21">felt easy? hard? don't</text>
      <text x="132" y="342" font-size="21">remember</text>
      <text x="132" y="392" font-size="21">Legs – squat 185?</text>
      <text x="132" y="432" font-size="21">(skipped notes Thu)</text>
    </g>
    <line x1="132" y1="186" x2="275" y2="186" stroke="#2f3b4a" stroke-width="2.5"/>
    <!-- coffee ring -->
    <circle cx="430" cy="360" r="42" fill="none" stroke="#a16207" stroke-opacity="0.35" stroke-width="7"/>
    <circle cx="436" cy="356" r="42" fill="none" stroke="#a16207" stroke-opacity="0.15" stroke-width="3"/>
  </g>

  <!-- sticky question -->
  <g transform="rotate(6 650 150)" filter="url(#sh)">
    <rect x="565" y="70" width="190" height="160" fill="#fde68a"/>
    <text class="h" x="582" y="116" font-size="23" fill="#3f3a2e">What did I</text>
    <text class="h" x="582" y="150" font-size="23" fill="#3f3a2e">lift last time?</text>
    <text class="h" x="610" y="200" font-size="40" fill="#dc2626">???</text>
  </g>

  <!-- dumbbell -->
  <g transform="translate(580 318)">
    <rect x="0" y="22" width="26" height="76" rx="6" fill="#20252b"/><rect x="26" y="34" width="18" height="52" rx="5" fill="#2d333a"/>
    <rect x="44" y="52" width="92" height="16" rx="6" fill="#9aa3ad"/>
    <rect x="136" y="34" width="18" height="52" rx="5" fill="#2d333a"/><rect x="154" y="22" width="26" height="76" rx="6" fill="#20252b"/>
  </g>

  <text class="h" x="400" y="510" font-size="22" fill="#fca5a5" text-anchor="middle">Guess low, repeat the same weight for three weeks</text>
  <rect x="20" y="16" width="96" height="32" rx="16" fill="#b91c1c"/>
  <text x="68" y="38" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1.5">BEFORE</text>
</svg>
