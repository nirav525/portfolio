<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#500724" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="800" height="560" fill="#fbf1f5"/>

  <!-- the Slack alert -->
  <g filter="url(#sh)"><rect x="36" y="58" width="460" height="420" rx="16" fill="#fff"/></g>
  <text x="58" y="88" font-size="13" font-weight="700" fill="#1f2933"># food-safety</text>
  <line x1="36" y1="102" x2="496" y2="102" stroke="#eef0f2"/>
  <rect x="58" y="116" width="30" height="30" rx="7" fill="#be185d"/>
  <path d="M73 122 l9 4 v7 c0 5 -4 8 -9 10 c-5 -2 -9 -5 -9 -10 v-7 z" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="98" y="128" font-size="13" font-weight="700" fill="#1f2933">Recall monitor</text>
  <text x="98" y="145" font-size="11" fill="#6b7280">checks the FDA and USDA feeds on its own</text>

  <rect x="58" y="160" width="4" height="214" rx="2" fill="#be185d"/>
  <text x="74" y="180" font-size="14" font-weight="700" fill="#9d174d">Possible match: one of our products</text>
  <g font-size="12" fill="#374151">
    <text x="74" y="206" fill="#6b7280">Agency</text><text x="160" y="206">FDA · Class II</text>
    <text x="74" y="228" fill="#6b7280">Reason</text><text x="160" y="228">Undeclared milk</text>
    <text x="74" y="250" fill="#6b7280">Their name</text><text x="160" y="250">chkn tikka masala w/ basmati rice</text>
    <text x="74" y="272" fill="#6b7280">Ours</text><text x="160" y="272" font-weight="700" fill="#1f2933">Chicken Tikka Bowl</text>
  </g>
  <text x="74" y="306" font-size="11" fill="#6b7280">How close the names are</text>
  <rect x="74" y="316" width="300" height="10" rx="5" fill="#fce7f3"/>
  <rect x="74" y="316" width="258" height="10" rx="5" fill="#be185d"/>
  <line x1="299" y1="310" x2="299" y2="332" stroke="#1f2933" stroke-width="2"/>
  <text x="299" y="348" font-size="10.5" fill="#6b7280" text-anchor="middle">alert line</text>
  <text x="388" y="326" font-size="12" font-weight="700" fill="#9d174d">0.86</text>

  <rect x="58" y="400" width="140" height="34" rx="9" fill="#be185d"/>
  <text x="128" y="422" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Where is it?</text>
  <rect x="208" y="400" width="110" height="34" rx="9" fill="#fff" stroke="#be185d" stroke-width="1.5"/>
  <text x="263" y="422" font-size="13" font-weight="600" fill="#be185d" text-anchor="middle">Not ours</text>
  <text x="58" y="458" font-size="11.5" fill="#6b7280">A person decides. The monitor just makes sure we see it.</text>

  <!-- where it is -->
  <g filter="url(#sh)"><rect x="520" y="58" width="244" height="250" rx="16" fill="#fff"/></g>
  <text x="540" y="88" font-size="13" font-weight="700" fill="#1f2933">Chicken Tikka Bowl, lot 2291</text>
  <text x="540" y="106" font-size="11" fill="#6b7280">from the inventory records</text>
  <g font-size="12.5" fill="#1f2933">
    <text x="540" y="140">HQ freezer</text><text x="744" y="140" text-anchor="end" font-weight="700">37</text>
    <text x="540" y="168">Library 2F</text><text x="744" y="168" text-anchor="end" font-weight="700">4</text>
    <text x="540" y="196">Dorm hall</text><text x="744" y="196" text-anchor="end" font-weight="700">3</text>
  </g>
  <line x1="540" y1="212" x2="744" y2="212" stroke="#eef0f2"/>
  <text x="540" y="236" font-size="12.5" fill="#374151">3 places to pull from.</text>
  <text x="540" y="256" font-size="12.5" fill="#374151">Every other machine is clear.</text>
  <text x="540" y="286" font-size="11" fill="#9ca3af">Minutes, not an afternoon of sheets.</text>

  <!-- feeds -->
  <g filter="url(#sh)"><rect x="520" y="328" width="244" height="150" rx="16" fill="#fff"/></g>
  <text x="540" y="358" font-size="13" font-weight="700" fill="#1f2933">Today's check</text>
  <g font-size="12.5" fill="#374151">
    <circle cx="547" cy="384" r="7" fill="#16a34a"/><path d="M543.5 384 l2.5 2.5 4.5 -4.5" stroke="#fff" stroke-width="1.8" fill="none"/>
    <text x="562" y="388">FDA notices read</text>
    <circle cx="547" cy="410" r="7" fill="#16a34a"/><path d="M543.5 410 l2.5 2.5 4.5 -4.5" stroke="#fff" stroke-width="1.8" fill="none"/>
    <text x="562" y="414">USDA notices read</text>
    <text x="540" y="446" font-size="11.5" fill="#6b7280">Everything else: no match,</text>
    <text x="540" y="463" font-size="11.5" fill="#6b7280">so no message.</text>
  </g>

  <text x="400" y="520" font-size="17" font-weight="700" fill="#500724" text-anchor="middle">The notice finds us. A person decides what to pull.</text>
  <rect x="20" y="10" width="86" height="32" rx="16" fill="#be185d"/>
  <text x="63" y="32" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1.5">AFTER</text>
</svg>
