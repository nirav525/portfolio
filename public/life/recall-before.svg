<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3b2f1e" flood-opacity="0.18"/></filter>
    <style>.h{font-family:'Bradley Hand','Segoe Print','Comic Sans MS',cursive}</style>
  </defs>
  <rect width="800" height="560" fill="#f5efe4"/>

  <!-- a recall notice, free text -->
  <g filter="url(#sh)"><rect x="30" y="58" width="450" height="300" rx="10" fill="#fff"/></g>
  <rect x="30" y="58" width="450" height="30" rx="10" fill="#e5e7eb"/><rect x="30" y="76" width="450" height="12" fill="#e5e7eb"/>
  <text x="44" y="78" font-size="11" fill="#4b5563">Recall notice · 1 of 14 this week</text>
  <text x="50" y="118" font-size="15" font-weight="700" fill="#1f2933">Northfield Foods recalls frozen meals</text>
  <text x="50" y="136" font-size="11" fill="#6b7280">Company announcement · Class II</text>
  <rect x="48" y="176" width="228" height="20" fill="#fde68a"/>
  <g font-size="12.5" fill="#374151">
    <text x="50" y="170">…is recalling approx. 4,200 lbs of frozen</text>
    <text x="50" y="190">chkn tikka masala w/ basmati rice (10 oz) because</text>
    <text x="50" y="210">it may contain milk, an allergen not declared on</text>
    <text x="50" y="230">the label. Products were shipped to distributors</text>
    <text x="50" y="250">in CA, AZ and NV. Lot codes printed on the side</text>
    <text x="50" y="270">panel include 2291, 2292 and…</text>
  </g>
  <g font-size="11.5" fill="#9ca3af"><text x="50" y="312">Scroll for 3 more pages ↓</text></g>

  <!-- printed SKU list with pen marks -->
  <g filter="url(#sh)" transform="rotate(3 630 230)">
    <rect x="512" y="70" width="250" height="320" fill="#fff"/>
    <text x="528" y="100" font-size="12" font-weight="700" fill="#1f2933">Our products (printed Oct)</text>
    <g font-size="12.5" fill="#1f2933" font-family="Menlo, monospace">
      <text x="528" y="134">Chicken Tikka Bowl</text>
      <text x="528" y="162">Butter Chicken</text>
      <text x="528" y="190">Mac &amp; Cheese</text>
      <text x="528" y="218">Teriyaki Bowl</text>
      <text x="528" y="246">Veggie Biryani</text>
      <text x="528" y="274">Pasta Alfredo</text>
      <text x="528" y="302">… + 40 more</text>
    </g>
    <ellipse cx="596" cy="129" rx="76" ry="14" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <g stroke="#2563eb" stroke-width="2.2" fill="none"><path d="M724 157 l5 6 9 -11"/><path d="M724 185 l5 6 9 -11"/><path d="M724 213 l5 6 9 -11"/></g>
    <text class="h" x="626" y="360" font-size="19" fill="#b91c1c">same thing??</text>
  </g>
  <path d="M290 186 q130 -40 214 -46" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 5"/>

  <!-- sticky note -->
  <g filter="url(#sh)" transform="rotate(-4 130 440)">
    <rect x="40" y="386" width="190" height="110" fill="#fde68a"/>
    <circle cx="135" cy="391" r="7" fill="#ef4444"/>
    <text class="h" x="56" y="428" font-size="20" fill="#3f3a2e">check USDA</text>
    <text class="h" x="56" y="456" font-size="20" fill="#3f3a2e">site too!!</text>
    <text class="h" x="56" y="482" font-size="15" fill="#6b7280">last checked: ?</text>
  </g>

  <!-- the nagging question -->
  <g filter="url(#sh)"><rect x="270" y="400" width="250" height="78" rx="14" fill="#fff"/></g>
  <text x="286" y="422" font-size="10.5" fill="#9ca3af">Ops · Friday</text>
  <rect x="286" y="428" width="218" height="26" rx="13" fill="#f1f5f9"/>
  <text x="298" y="445" font-size="12" fill="#1f2933">did anyone check recalls this week?</text>

  <text class="h" x="400" y="530" font-size="21" fill="#b91c1c" text-anchor="middle">two agencies · free-text notices · their name never quite matches ours</text>
  <rect x="20" y="10" width="96" height="32" rx="16" fill="#b91c1c"/>
  <text x="68" y="32" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1.5">BEFORE</text>
</svg>
