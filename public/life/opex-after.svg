<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#172554" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="800" height="560" fill="#eff4fd"/>

  <!-- the definition -->
  <g filter="url(#sh)"><rect x="36" y="58" width="728" height="112" rx="16" fill="#fff"/></g>
  <text x="60" y="90" font-size="10.5" font-weight="700" fill="#1d4ed8" letter-spacing="1">ONE NUMBER: FLEET OPEX PER UNIT</text>
  <g font-size="17" fill="#1f2933">
    <rect x="60" y="106" width="292" height="44" rx="10" fill="#f1f5ff"/>
    <text x="206" y="134" text-anchor="middle">All-in service cost this month</text>
    <text x="378" y="136" font-size="24" text-anchor="middle" fill="#6b7280">÷</text>
    <rect x="404" y="106" width="166" height="44" rx="10" fill="#f1f5ff"/>
    <text x="487" y="134" text-anchor="middle">Active machines</text>
    <text x="596" y="136" font-size="24" text-anchor="middle" fill="#6b7280">=</text>
    <rect x="622" y="106" width="120" height="44" rx="10" fill="#1d4ed8"/>
    <text x="682" y="134" text-anchor="middle" fill="#fff" font-weight="700">per machine</text>
  </g>

  <!-- chart: fleet grows, cost per machine falls -->
  <g filter="url(#sh)"><rect x="36" y="190" width="728" height="290" rx="16" fill="#fff"/></g>
  <text x="60" y="222" font-size="14" font-weight="700" fill="#1f2933">More machines, each one cheaper to run</text>
  <g font-size="11.5" fill="#374151">
    <rect x="470" y="210" width="12" height="12" rx="3" fill="#dbe4fb"/><text x="488" y="220">Machines in the fleet</text>
    <rect x="620" y="214" width="20" height="4" rx="2" fill="#1d4ed8"/><text x="646" y="220">Cost per machine</text>
  </g>
  <line x1="70" y1="440" x2="730" y2="440" stroke="#d1d5db"/>
  <!-- bars 15 -> 35 -->
  <g fill="#dbe4fb">
    <rect x="86" y="371" width="44" height="69" rx="4"/>
    <rect x="166" y="368" width="44" height="72" rx="4"/>
    <rect x="246" y="352" width="44" height="88" rx="4"/>
    <rect x="326" y="336" width="44" height="104" rx="4"/>
    <rect x="406" y="320" width="44" height="120" rx="4"/>
    <rect x="486" y="304" width="44" height="136" rx="4"/>
  </g>
  <rect x="566" y="290" width="44" height="150" rx="4" fill="#dbe4fb"/>
  <rect x="646" y="280" width="44" height="160" rx="4" fill="#dbe4fb"/>
  <g font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">
    <text x="108" y="363">15</text><text x="668" y="272">35</text>
  </g>
  <!-- cost per machine line, falls by a third -->
  <polyline points="108,262 188,266 268,282 348,292 428,306 508,316 588,324 668,322" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#1d4ed8"><circle cx="108" cy="262" r="5"/><circle cx="668" cy="322" r="5"/></g>
  <rect x="682" y="296" width="62" height="26" rx="13" fill="#1d4ed8"/>
  <text x="713" y="314" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">−33%</text>
  <g font-size="10.5" fill="#9ca3af"><text x="86" y="460">start</text><text x="650" y="460">later</text></g>

  <text x="400" y="516" font-size="17" font-weight="700" fill="#172554" text-anchor="middle">Now "is growth getting cheaper?" has an answer: yes, by a third.</text>
  <text x="400" y="540" font-size="11.5" fill="#64748b" text-anchor="middle">Shape is illustrative. The real cost figures are internal; the −33% is real.</text>
  <rect x="20" y="10" width="86" height="32" rx="16" fill="#1d4ed8"/>
  <text x="63" y="32" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1.5">AFTER</text>
</svg>
