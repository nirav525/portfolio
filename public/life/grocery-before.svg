<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3b2f1e" flood-opacity="0.18"/></filter>
    <style>.h{font-family:'Bradley Hand','Segoe Print','Comic Sans MS',cursive}</style>
  </defs>
  <rect width="800" height="560" fill="#f5efe4"/>
  <rect y="470" width="800" height="90" fill="#e6dccb"/>

  <!-- fridge door -->
  <rect x="34" y="28" width="290" height="500" rx="18" fill="#eceff1" stroke="#cfd6db" stroke-width="2"/>
  <rect x="296" y="120" width="12" height="150" rx="6" fill="#c3ccd2"/>
  <g filter="url(#sh)">
    <g transform="rotate(-6 120 110)"><rect x="60" y="62" width="130" height="110" fill="#fde68a"/><circle cx="125" cy="66" r="7" fill="#ef4444"/>
      <text class="h" x="74" y="112" font-size="26" fill="#3f3a2e">onions!!</text><text class="h" x="76" y="148" font-size="18" fill="#3f3a2e">(red? white?)</text></g>
    <g transform="rotate(5 245 120)"><rect x="185" y="72" width="115" height="100" fill="#fbcfe8"/><circle cx="242" cy="76" r="7" fill="#2563eb"/>
      <text class="h" x="196" y="118" font-size="22" fill="#3f3a2e">garlic??</text><text class="h" x="196" y="150" font-size="16" fill="#3f3a2e">ran out Tue</text></g>
    <g transform="rotate(3 125 270)"><rect x="58" y="210" width="150" height="112" fill="#bfdbfe"/><circle cx="133" cy="214" r="7" fill="#16a34a"/>
      <text class="h" x="70" y="254" font-size="20" fill="#3f3a2e">paneer –</text><text class="h" x="70" y="284" font-size="20" fill="#3f3a2e">Indian store</text><text class="h" x="70" y="310" font-size="16" fill="#3f3a2e">or TJ's?</text></g>
    <g transform="rotate(-4 240 390)"><rect x="170" y="330" width="140" height="122" fill="#fff"/><circle cx="240" cy="334" r="7" fill="#f59e0b"/>
      <text class="h" x="182" y="370" font-size="20" fill="#3f3a2e">Wed dinner:</text><text class="h" x="196" y="404" font-size="30" fill="#dc2626">???</text>
      <text class="h" x="182" y="436" font-size="15" fill="#3f3a2e">whatever's left</text></g>
    <g transform="rotate(-8 105 400)"><rect x="52" y="352" width="100" height="84" fill="#fde68a"/>
      <text class="h" x="62" y="392" font-size="19" fill="#3f3a2e">cumin –</text><text class="h" x="62" y="420" font-size="19" fill="#3f3a2e">have it?</text></g>
  </g>

  <!-- phone with a messy notes list -->
  <g filter="url(#sh)">
    <rect x="360" y="46" width="200" height="410" rx="28" fill="#1f2933"/>
    <rect x="370" y="58" width="180" height="386" rx="20" fill="#fffdf6"/>
  </g>
  <rect x="430" y="66" width="60" height="8" rx="4" fill="#1f2933"/>
  <text x="386" y="104" font-size="19" font-weight="700" fill="#1f2933">groceries</text>
  <text x="386" y="124" font-size="11" fill="#8a8f96">edited 11 times</text>
  <g font-size="15" fill="#1f2933">
    <text x="386" y="156">onion</text>
    <text x="386" y="182">tomatoes</text>
    <text x="386" y="208">cilantro</text>
    <text x="386" y="234">onion (2?)</text>
    <text x="386" y="260">coconut milk</text>
    <text x="386" y="286" fill="#9aa0a6">garlic</text><line x1="384" y1="281" x2="432" y2="281" stroke="#9aa0a6" stroke-width="2"/>
    <text x="386" y="312">chickpeas</text>
    <text x="386" y="338" font-weight="700">ONION</text>
    <text x="386" y="364">tomato?</text>
    <text x="386" y="390">yogurt</text>
    <text x="386" y="416" fill="#9aa0a6">…</text>
  </g>
  <g stroke="#dc2626" stroke-width="2.5" fill="none">
    <ellipse cx="410" cy="151" rx="30" ry="13"/><ellipse cx="420" cy="229" rx="40" ry="13"/><ellipse cx="414" cy="333" rx="34" ry="13"/>
  </g>

  <!-- three receipts -->
  <g filter="url(#sh)">
    <g transform="rotate(-7 640 170)"><path d="M590 70 h120 v190 l-10 8 -10 -8 -10 8 -10 -8 -10 8 -10 -8 -10 8 -10 -8 -10 8 -10 -8 -10 8 -10 -8 z" fill="#fff"/>
      <text x="602" y="98" font-size="13" font-weight="700" fill="#1f2933">WAREHOUSE STORE</text>
      <g font-size="12" fill="#4b5563" font-family="Menlo, monospace"><text x="602" y="126">ONION 3LB</text><text x="602" y="146">RICE 10LB</text><text x="602" y="166">TOMATO</text><text x="602" y="186">YOGURT</text></g></g>
    <g transform="rotate(5 690 300)"><path d="M630 200 h120 v170 l-10 8 -10 -8 -10 8 -10 -8 -10 8 -10 -8 -10 8 -10 -8 -10 8 -10 -8 -10 8 -10 -8 z" fill="#fff"/>
      <text x="642" y="228" font-size="13" font-weight="700" fill="#1f2933">TRADER JOE'S</text>
      <g font-size="12" fill="#4b5563" font-family="Menlo, monospace"><text x="642" y="256">ONIONS</text><text x="642" y="276">PASTA</text><text x="642" y="296">COCONUT MILK</text><text x="642" y="316">CILANTRO</text></g></g>
    <g transform="rotate(-3 640 400)"><path d="M584 330 h124 v130 l-10 8 -10 -8 -10 8 -10 -8 -10 8 -10 -8 -10 8 -10 -8 -10 8 -10 -8 -10 8 -12 -8 z" fill="#fff"/>
      <text x="596" y="358" font-size="13" font-weight="700" fill="#1f2933">INDIAN GROCERY</text>
      <g font-size="12" fill="#4b5563" font-family="Menlo, monospace"><text x="596" y="386">PANEER</text><text x="596" y="406">RED ONION</text><text x="596" y="426">CHANA DAL</text></g></g>
  </g>
  <g stroke="#dc2626" stroke-width="2.5" fill="none">
    <path d="M598 120 q40 -6 66 4" transform="rotate(-7 640 170)"/><path d="M638 250 q30 -6 52 4" transform="rotate(5 690 300)"/><path d="M592 400 q36 -6 70 4" transform="rotate(-3 640 400)"/>
  </g>

  <text class="h" x="400" y="512" font-size="22" fill="#b91c1c" text-anchor="middle">3 stores · 3 lists · 3 lots of onions · still forgot garlic</text>
  <rect x="20" y="16" width="96" height="32" rx="16" fill="#b91c1c"/>
  <text x="68" y="38" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1.5">BEFORE</text>
</svg>
